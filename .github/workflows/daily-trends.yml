# ================================================================
# 每日文学热点 + 书籍推荐 + 新文抓取
# 每天北京时间 00:00（UTC 16:00）执行
# ================================================================
# 需要的 GitHub Secrets：
#   ANTHROPIC_API_KEY  — Claude API 深度分析、推荐理由、新文摘要（必填）
#   OPENAI_API_KEY     — 降级备选（选填）
#   SERPER_API_KEY     — Google 搜索扩展新闻源（选填）
# ================================================================

name: Daily Literature Update

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build works snapshot
        run: npm run recommend:snapshot

      - name: Fetch daily trends
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: npm run trends:fetch

      - name: Fetch daily recommendation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run recommend:fetch

      - name: Fetch new works (CI mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run newworks:fetch -- --ci

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TODAY=$(date +%Y-%m-%d)
          CHANGED=0

          for FILE in \
            data/daily-trends.json \
            data/daily-recommendation.json \
            data/daily-new-works.json \
            data/recommendation-history.json \
            data/works-snapshot.json \
            "data/new-works-archive/" \
          ; do
            if [ -d "$FILE" ]; then
              if ! git diff --quiet HEAD -- "$FILE"; then
                git add "$FILE"
                CHANGED=1
              fi
            else
              if ! git diff --quiet HEAD -- "$FILE"; then
                git add "$FILE"
                CHANGED=1
              fi
            fi
          done

          if [ "$CHANGED" -eq 1 ]; then
            git commit -m "daily: update trends/recommendation/new-works ${TODAY} [automated]"
            git push
            echo "✅ 已推送更新，Vercel 将自动重新部署"
          else
            echo "⏭ 所有数据文件无变化，跳过 commit"
          fi
